services:
  bg-offers:
    image: ghcr.io/jensgiehl/bg-offers:latest
    container_name: bg-offers
    network_mode: host
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_PORT: "${SERVER_PORT:-8089}"
      DB_PATH: /app/data/bg-offers
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
