services:
  bg-prices:
    image: ${BG_PRICES_IMAGE:-bg-prices:local}
    build:
      context: ${BG_PRICES_SOURCE_DIR:-../brettspielpreise}
    pull_policy: never
    container_name: bg-prices
    network_mode: host
    init: true
    restart: unless-stopped
    user: "10001:10001"
    shm_size: 256m
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 65s
    security_opt:
      - seccomp=${BG_PRICES_SOURCE_DIR:-../brettspielpreise}/docker/seccomp_profile.json
    environment:
      SERVER_PORT: "8077"
      DB_PATH: /app/data/bg-prices
      PRICES_HEADLESS: "true"
      PRICES_SANDBOX: "true"
      PRICES_SOURCE_CHECK_ENABLED: "false"
      PRICES_SOURCE_CHECK_AT_STARTUP: "false"
      IPV6_PROXY_ENABLED: "${IPV6_PROXY_ENABLED:-false}"
    volumes:
      - type: bind
        source: ./price-data
        target: /app/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVER_PORT}/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
  bg-offers:
    image: ghcr.io/jensgiehl/bg-offers:latest
    container_name: bg-offers
    depends_on:
      bg-prices:
        condition: service_healthy
    network_mode: host
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_PORT: "${SERVER_PORT:-8089}"
      DB_PATH: /app/data/bg-offers
      PRICE_COMPARISON_URL: "${PRICE_COMPARISON_URL:-http://localhost:8077}"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
